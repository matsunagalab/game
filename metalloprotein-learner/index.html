n","Ca","Mn"],why:{Ca:"Thermolysin does carry four Ca^2+ ions, but elsewhere, for heat stability. At 2.0 \xC5 this site is much too tight for calcium.",Mn:"Manganese prefers oxygen and longer bonds, near 2.2 \xC5. This site measures closer to 1.9 \xC5."}}}],note:"His142 and His146 sit about one helical turn apart, so the HEXXH motif places both on the same face. Glu143, between them in sequence, points at the water instead of the metal. You will see this motif in many zinc proteases."},A4:{kind:"site",site:"adh",name:"Alcohol dehydrogenase",protein:"Alcohol dehydrogenase",org:"Horse",metal:"Zn",clue:"This colorless enzyme holds two zinc ions about 20 \xC5 apart. One binds the alcohol. This one sits in a small lobe far from any substrate.",stages:[{find:"Four sulfurs, all from cysteine. Tap each one.",soak:{answer:"Zn",options:["Zn","Fe","Ca"],why:{Fe:"Iron can sit in a Cys_4 site, as you will see in well B1, but that site is red and carries electrons. This protein is colorless and this site does no redox chemistry.",Ca:"Calcium wants oxygen. Four thiolates are the wrong offer."}}}],note:"Same ligands and same shape as the iron in rubredoxin, for a different job. This zinc only stitches a lobe together. So ligands alone do not name the metal: you also need the color and the function."},A5:{kind:"site",site:"ndm1",name:"NDM-1",protein:"New Delhi metallo-\u03B2-lactamase 1",org:"Klebsiella pneumoniae",metal:"Zn",clue:"This enzyme destroys carbapenems, last-line antibiotics. Two ions sit 3.6 \xC5 apart, and here a drug, L-captopril, wedges its sulfur between them.",stages:[{find:"First ion: three histidines and the sulfur of the drug.",soak:{answer:"Zn",options:["Zn","Mg","Ca"],why:{Mg:"Magnesium prefers oxygen, and here it would be offered three histidines and a thiol.",Ca:"Calcium is too large for bonds near 2.1 \xC5."}}},{find:"Second ion: the drug sulfur is shared. Find the other three atoms.",auto:!0}],note:"In the working enzyme a hydroxide bridges the two zinc ions and opens the \u03B2-lactam ring. The thiol of captopril takes that bridging position. Notice that the two sites differ: His_3 on one side, Asp, Cys and His on the other."},A6:{kind:"arcade",game:"sort",name:"Hard or soft",metal:"Ca",clue:"Ions that hold their electrons tightly are hard and want oxygen. Easily polarized ions are soft and want sulfur. The ones in between take nitrogen.",note:"Pearson\u2019s rule of thumb explains most of what you saw in row A and will see in rows B to D. Zinc is borderline, which is why it takes His, Cys, Asp and Glu alike."},B1:{kind:"site",site:"rubredoxin",name:"Rubredoxin",protein:"Rubredoxin",org:"Clostridium pasteurianum",metal:"Fe",tint:"#ff4a32",clue:"A red protein of only 54 residues. It shuttles one electron at a time.",stages:[{find:"Four sulfurs hold this ion. Tap each one.",soak:{answer:"Fe",options:["Fe","Zn","Mg"],why:{Zn:"Zinc would fit a Cys_4 site, but it has only one stable charge, so it could never carry an electron. It is also colorless.",Mg:"Magnesium avoids sulfur, and it cannot change charge."}}}],note:"The simplest iron-sulfur protein: one iron, four cysteines, no inorganic sulfur. The iron cycles between Fe^2+ and Fe^3+. The red color comes from charge moving between sulfur and iron."},B2:{kind:"site",site:"myoglobin",name:"Myoglobin",protein:"Oxymyoglobin",org:"Sperm whale",metal:"Fe",heme:!0,clue:"Muscle stores oxygen in this protein, the first protein structure ever solved. The ring in the pocket already offers four nitrogens.",stages:[{find:"The heme gives four nitrogens. Find the two atoms above and below the ring.",notes:{"A64.NE2":"This is distal His64. It hydrogen-bonds the bound O_2 but does not touch the metal.","A64.ND1":"This is distal His64, and this nitrogen points away from the site.","A157.O2":"This is the far atom of O_2. It binds end-on and bent, through the near atom."},soak:{answer:"Fe",options:["Fe","Mg","Zn"],why:{Mg:"Magnesium in a similar ring gives you chlorophyll, not an oxygen store. It cannot bind O_2.",Zn:"Zinc fills the ring but cannot bind O_2. Its full d shell has no way to bond to it."}}}],note:"Proximal His93 anchors the iron from below, and O_2 binds on the other face. Distal His64 hydrogen-bonds it, so O_2 binds more tightly than it otherwise would. Without the protein around it, heme iron oxidizes quickly in water."},B3:{kind:"site",site:"cytc",name:"Cytochrome c",protein:"Iso-1-cytochrome c",org:"Yeast",metal:"Fe",heme:!0,clue:"This heme protein hands electrons along the respiratory chain. It does not bind oxygen, and the reason is in the pocket.",stages:[{find:"Find the two atoms that close the heme from above and below.",notes:{"A67.OH":"Tyr67 hydrogen-bonds the sulfur of Met80 from the second shell."},soak:{answer:"Fe",options:["Fe","Cu","Co"],why:{Cu:"Copper binds porphyrins too, but it would not use two axial ligands this way.",Co:"Cobalt does sit in tetrapyrroles, as you will see in well D4, but this is a heme, and heme means iron."}}}],note:"With His18 below and Met80 above, no position is free for O_2. The iron can only move electrons. Sulfur from methionine is an unusual ligand for heme, and it helps set the redox potential."},B4:{kind:"site",site:"p450",name:"Cytochrome P450cam",protein:"Cytochrome P450cam with camphor",org:"Pseudomonas putida",metal:"Fe",heme:!0,clue:"This enzyme inserts an oxygen atom into a C\u2013H bond of camphor, a very hard reaction. Its heme looks like the one in myoglobin, on a different anchor.",stages:[{find:"The heme gives four nitrogens. Find the fifth atom. There is no sixth here.",notes:{"A252.OG1":"Thr252 helps protons reach bound oxygen, far from the metal."},soak:{answer:"Fe",options:["Fe","Co","Mn"],why:{Co:"Cobalt fits a tetrapyrrole, but this ring is heme.",Mn:"Manganese prefers oxygen ligands. Heme means iron."}}}],note:"A cysteine thiolate replaces the histidine of myoglobin. It pushes electrons onto the iron, which helps split the O\u2013O bond. With camphor in the pocket the sixth position is empty, and that gap is where O_2 will bind."},B5:{kind:"site",site:"fe4s4",name:"Ferredoxin",protein:"[4Fe-4S] ferredoxin",org:"Bacillus thermoproteolyticus",metal:"Fe",tint:"#ff9a4a",cluster:!0,clue:"The metal center here is not one ion but four, locked into a cage with four sulfides. This structure reaches 0.92 \xC5.",stages:[{find:"The cage is in place. Find the four cysteines that anchor it.",ask:{q:"What shape is this cage?",options:[{label:"A distorted cube",ok:!0},{label:"A flat ring",why:"Turn the cage and look along it. The atoms fill all three dimensions."},{label:"A single tetrahedron",why:"Each iron is tetrahedral, but eight atoms make the whole cage."}]},soak:{answer:"Fe",options:["Fe","Zn","Cu"],why:{Zn:"Zinc cannot share electrons around a cage. It has only one stable charge.",Cu:"Copper does not build these cubes. Rust-colored clusters like this are iron."}}}],note:"Iron and sulfide take alternate corners of a distorted cube. Each iron is tetrahedral, with three sulfides and one cysteine. Electrons spread across the whole cage, which makes it a very good electron carrier."},B6:{kind:"arcade",game:"edge",name:"Edge scan",metal:"Fe",clue:"At a synchrotron you can name a metal without guessing. Each element absorbs X-rays sharply at its own energy, its K-edge.",note:"Edges climb steadily with atomic number, the same trend Moseley found in X-ray emission lines. Crystallographers use exactly this scan to name the metal in a new structure."},C1:{kind:"site",site:"plastocyanin",name:"Plastocyanin",protein:"Plastocyanin",org:"Poplar",metal:"Cu",clue:"In the chloroplast this protein carries electrons toward photosystem I. It is a deep blue, with a strong band near 600 nm that simple complexes of this metal lack.",stages:[{find:"Four ligands: two histidines, a cysteine, and a methionine that sits further out than the rest.",soak:{answer:"Cu",options:["Cu","Fe","Zn"],why:{Fe:"Iron with cysteine is red, as in rubredoxin. Intense blue points elsewhere.",Zn:"Zinc is colorless and cannot carry an electron."}}}],note:"Cu^2+ alone leans toward a square plane and Cu^+ toward a tetrahedron. This site sits between the two, so transferring an electron costs little movement. The classic explanation is the entatic state, where the protein forces this shape. How much is forced by the protein and how much by the cysteine ligand is still debated. The blue comes from charge moving from the cysteine sulfur, 2.07 \xC5 away, to the copper."},C2:{kind:"site",site:"azurin",name:"Azurin",protein:"Azurin",org:"Pseudomonas aeruginosa",metal:"Cu",clue:"A bacterial blue copper protein. It looks like plastocyanin with one more contact. Some of the bonds here are unusually long.",stages:[{find:"Find five atoms. Two of them sit near 3 \xC5, far longer than normal bonds. One is a backbone oxygen.",soak:{answer:"Cu",options:["Cu","Ni","Zn"],why:{Ni:"Nickel-substituted azurin exists, but it is not blue.",Zn:"Zinc-substituted azurin exists too, and it is colorless."}}}],note:"His46, His117 and Cys112 make a strong trigonal plane. Met121 at 3.18 \xC5 and the carbonyl of Gly45 at 2.84 \xC5 cap it from either side. Those weak contacts tune the redox potential, so count them even though they are long."},C3:{kind:"site",site:"sod",name:"Superoxide dismutase",protein:"Cu,Zn superoxide dismutase (SOD1), reduced",org:"Human",metal:"Cu",clue:"This enzyme destroys superoxide. One metal does the chemistry and the other holds the site in shape. His63 normally bridges them.",stages:[{find:"Start with the structural ion: three histidines and an aspartate.",notes:{"A83.OD2":"O\u03B42 sits at 2.85 \xC5. Asp83 binds through O\u03B41."},soak:{answer:"Zn",options:["Zn","Cu","Mg"],why:{Cu:"Close, but the chemistry happens next door. This one is the structural ion.",Mg:"Three histidines are the wrong offer for magnesium."}}},{find:"Now the catalytic ion. This is the reduced enzyme, so count which histidines truly reach it.",notes:{"A63.NE2":"His63 is 3.46 \xC5 away. In this reduced form the bridge is open, and His63 stays bound only to the other metal."},soak:{answer:"Cu",options:["Cu","Zn","Fe"],why:{Zn:"A Zn-Zn form does exist, and it is stable, but it cannot destroy superoxide.",Fe:"Iron superoxide dismutases exist, with a different site. This one is Cu,Zn SOD."}}}],note:"In the oxidized enzyme His63 bridges the two metals. Here, in the reduced enzyme, the bridge has opened and the copper keeps three histidines. Mutations in this protein cause some inherited ALS through a toxic gain of function linked to misfolding. Some hypotheses involve missing or wrong metals."},C4:{kind:"site",site:"hemocyanin",name:"Hemocyanin",protein:"Oxygenated hemocyanin",org:"Horseshoe crab",metal:"Cu",clue:"Horseshoe crabs carry oxygen without heme. Their blood turns blue when oxygenated. Here O_2 sits between two ions 3.6 \xC5 apart.",stages:[{find:"O_2 is already bound. Find the three histidines on the first ion.",soak:{answer:"Cu",options:["Cu","Fe","Zn"],why:{Fe:"Iron carries oxygen in heme or in hemerythrin. Neither is here, and those are not blue.",Zn:"Zinc cannot hand electrons to oxygen."}}},{find:"Now the three histidines on the second ion.",auto:!0,ask:{q:"Both oxygen atoms sit about 2 \xC5 from both metals. How does O_2 bind?",options:[{label:"Side-on to both",ok:!0},{label:"End-on to one",why:"Then only one oxygen would touch one metal."}]}}],note:"O_2 lies side-on between the coppers and is reduced to peroxide: the O\u2013O distance here is 1.41 \xC5, against 1.21 \xC5 in free O_2. Each copper gives up an electron, going from Cu^+ to Cu^2+. The blue comes from charge moving from the bound peroxide to the copper. This is a 2.4 \xC5 structure, so treat the finer distances with care."},C5:{kind:"site",site:"urease",name:"Urease",protein:"Urease",org:"Klebsiella aerogenes",metal:"Ni",clue:"Urease was the first enzyme ever crystallized, in 1926, and the first shown to need this metal, in 1975. Two ions sit 3.6 \xC5 apart.",stages:[{find:"Waters are already bound. Find three protein atoms on the first ion. One is on a modified lysine.",soak:{answer:"Ni",options:["Ni","Zn","Fe","Co"],why:{Zn:"A good guess for a dinuclear hydrolase, and related enzymes do use zinc. Urease is the famous exception.",Fe:"Related enzymes can use iron, but this is the classic case of a different metal.",Co:"Close in the periodic table, but not this one."}}},{find:"Second ion: find four protein atoms. The same lysine returns with its other oxygen.",auto:!0}],note:"Lys217 is carbamylated: CO_2 adds to its side chain, which gives it a carboxylate that bridges both ions. The gene just says lysine, so the sequence alone would never show this."},C6:{kind:"arcade",game:"keep",name:"Keep copper out",metal:"Cu",clue:"The Irving\u2013Williams series ranks how tightly divalent metals bind: Mn < Fe < Co < Ni < Cu > Zn. So a protein cannot pick its metal by affinity alone.",note:"Cells solve this by controlling where and when a protein folds, and by holding copper on chaperones. A protein left to chance would fill with copper."},D1:{kind:"site",site:"calmodulin",name:"Calmodulin",protein:"Calmodulin",org:"Paramecium tetraurelia",metal:"Ca",clue:"Calcium signals run through this protein. Each EF-hand loop grips one large ion that wants as many oxygens as it can get.",stages:[{find:"Seven oxygens. One is a water, one is a backbone carbonyl, and one glutamate gives both of its oxygens.",notes:{"A26.OG1":"Thr26 binds through its backbone carbonyl, not its side chain."},soak:{answer:"Ca",options:["Ca","Mg","Zn"],why:{Mg:"Magnesium is smaller and wants six ligands at 2.1 \xC5. It cannot fill seven positions at 2.4 \xC5. The difference between these two ions is what makes this a calcium switch.",Zn:"Zinc wants four tight ligands, often with nitrogen or sulfur. This cage is all oxygen and too wide."}}}],note:"An EF-hand loop is 12 residues long. Asp20, Asp22, Asp24 and the carbonyl of Thr26 line it, a water fills a gap, and Glu31 closes it with both oxygens. Seven ligands make a pentagonal bipyramid, the usual shape for calcium."},D2:{kind:"site",site:"kcsa",name:"KcsA channel",protein:"KcsA selectivity filter",org:"Streptomyces lividans",metal:"K",clue:"This channel passes potassium near the diffusion limit and rejects the smaller sodium ion. Four identical subunits line the pore with backbone carbonyls.",stages:[{find:"Two rings of four oxygens cage this ion. Tap one oxygen in each ring.",soak:{answer:"K",options:["K","Na","Ca"],why:{Na:"Na^+ wants oxygen at about 2.4 \xC5. Crowded, flexible carbonyls hold it less well than K^+, so it does not repay what it loses when it sheds its water.",Ca:"Calcium has twice the charge, and this filter is built for one."}}}],note:"Eight oxygens form a square antiprism, the same shape eight waters take around K^+ in the central cavity of this channel. The ion swaps water for carbonyls at almost no cost. That is half of selectivity. The other half is the crowded carbonyls themselves, which favor K^+ even as the filter flexes."},D3:{kind:"site",site:"polb",name:"DNA polymerase \u03B2",protein:"DNA polymerase \u03B2 with a nonreactive nucleotide",org:"Human",metal:"Mg",clue:"DNA polymerases use two ions 3.4 \xC5 apart, held by acidic residues. One carries the incoming nucleotide. The other readies the end of the growing strand.",stages:[{find:"Two phosphate oxygens are already bound. Find four more: two aspartates, one more phosphate oxygen and a water.",soak:{answer:"Mg",options:["Mg","Ca","Zn"],why:{Ca:"Calcium binds DNA polymerases but stalls them. Its bonds are too long for this tight site.",Zn:"Zinc prefers fewer ligands, often nitrogen or sulfur. Six oxygens at 2.1 \xC5 point elsewhere."}}},{find:"The catalytic ion. A shared phosphate oxygen and a water are bound. Find the other four, including the 3\u2032 oxygen of the primer.",auto:!0}],note:"This is the two-metal-ion mechanism. The nucleotide analog here cannot react, which freezes the moment just before chemistry. The primer 3\u2032 oxygen sits 2.19 \xC5 from the catalytic ion, right where it is activated to attack the phosphate."},D4:{kind:"site",site:"mcm",name:"Methylmalonyl-CoA mutase",protein:"Methylmalonyl-CoA mutase with cob(II)alamin",org:"Propionibacterium freudenreichii",metal:"Co",clue:"The ring here is a corrin, the heart of vitamin B_12. It resembles a porphyrin with one bridge missing. In the intact coenzyme a cobalt-carbon bond holds an adenosyl group, and that bond is built to break. In this structure it has already gone.",stages:[{find:"The corrin gives four nitrogens. Find the ligand from below.",notes:{"A608.OD1":"Asp608 hydrogen-bonds His610 from the second shell."},soak:{answer:"Co",options:["Co","Fe","Ni"],why:{Fe:"Iron goes in porphyrin. A corrin means B_12.",Ni:"Nickel has its own tetrapyrrole, F430, in methane-making microbes. A corrin means B_12."}}}],note:"Free B_12 uses its own dimethylbenzimidazole tail as this lower ligand. In the enzyme the tail swings away and His610 takes its place, a form called base-off, His-on. Dorothy Hodgkin solved the structure of B_12 by X-ray crystallography, work recognized with the 1964 Nobel Prize in Chemistry."},D5:{kind:"site",site:"psii",name:"Photosystem II",protein:"Photosystem II, oxygen-evolving center",org:"Thermosynechococcus vulcanus",metal:"Mn",cluster:!0,clue:"Nearly all the oxygen you breathe was made at this cluster. It pulls electrons out of water using light. This 1.9 \xC5 structure first located every metal, oxo bridge and bound water of the cluster.",stages:[{find:"Find seven protein ligands. Most carboxylates bridge two metals, so one tap binds both oxygens.",ask:{q:"How are the metals arranged?",options:[{label:"A distorted cube with one dangling ion",ok:!0},{label:"A flat ring of five",why:"Turn it. Four metals and the oxo bridges make a cube-like block, and the fifth hangs off."},{label:"A perfect cube",why:"A perfect cube has no dangling corner, and the bonds here are clearly unequa
