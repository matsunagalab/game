.icon:hover { color: var(--salt); }
#file { height: 44px; padding: 0 10px; font-family: var(--type); font-size: .78rem; color: var(--ink); background: var(--paper); transform: rotate(-1.2deg); box-shadow: 0 1px 6px rgba(0,0,0,.35); flex: none; }
