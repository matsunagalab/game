  --blue: #1b3f6b;
  --ink: #101d38;
  --red: #c8402a;
  --sage: #6e8b6a;
  --ochre: #d9b36c;
  --washi: #e9e2cf;
  --top: env(safe-area-inset-top, 0px);
  --bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: var(--blue); color: var(--ink); overscroll-behavior: none; }
body { font: 500 16px/1.5 'Shippori Mincho', 'Hiragino Mincho ProN', Georgia, 'Times New Roman', serif; -webkit-text-size-adjust: 100%; user-select: none; -webkit-user-select: none; }
#gl, #ov { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#gl { touch-action: none; }
#ov { pointer-events: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, [role=slider]:focus-visible, input:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
h1, h2 { font-weight: 700; }
[hidden] { display: none !important; }

.stamp { background: var(--red); color: #fbf3e0; padding: 11px 22px; min-height: 48px; font-weight: 700; font-size: 17px; box-shadow: 3px 3px 0 var(--ink); transition: transform .08s; }
.stamp:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.stamp:disabled { background: #a8a290; box-shadow: none; }
.stamp.quiet { background: #f3ecd8; color: var(--ink); box-shadow: 0 0 0 1.5px var(--ink), 3px 3px 0 var(--ink); }
.stamp.on { background: var(--blue); color: #fbf3e0; }
.plain { padding: 12px 6px; min-height: 48px; text-decoration: underline; text-underline-offset: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.icon { width: 44px; height: 44px; font-size: 26px; line-height: 1; display: grid; place-items: center; flex: none; }
.icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; }

.page { position: fixed; inset: 0; }
#title { background: linear-gradient(rgba(12, 30, 60, .88), rgba(12, 30, 60, .5) 34%, transparent 46%, rgba(13, 26, 54, .1) 52%, rgba(13, 26, 54, .78) 62%, rgba(13, 26, 54, .95) 78%); color: #f7f0dc; padding: calc(var(--top) + 26px) 22px calc(var(--bottom) + 20px); display: flex; flex-direction: column; pointer-events: none; }
#title h1 { font-size: clamp(33px, 10vw, 62px); line-height: 1.08; max-width: 8.6em; letter-spacing: -.01em; text-shadow: 0 1px 0 rgba(10, 20, 40, .35); }
#title .foot { margin-top: auto; }
#title .lede { max-width: 25em; font-size: 16.5px; line-height: 1.6; margin-bottom: 14px; text-shadow: 0 1px 3px rgba(10, 20, 40, .7); }
#title .actions { pointer-events: auto; }
#title .plain { color: #f7f0dc; text-shadow: 0 1px 3px rgba(10, 20, 40, .8); }
.cartouche { position: absolute; right: 16px; top: calc(var(--top) + 26px); writing-mode: vertical-rl; background: var(--red); color: #fbf3e0; font-weight: 700; font-size: 15px; letter-spacing: .14em; padding: 9px 4px; box-shadow: 0 0 0 1.5px #fbf3e0, 0 0 0 2.5px var(--red); }

#album { background: var(--washi); overflow-y: auto; -webkit-overflow-scrolling: touch; padding: calc(var(--top) + 6px) 14px calc(var(--bottom) + 22px); }
.bar { display: flex; align-items: center; gap: 4px; padding-bottom: 4px; }
.bar h2 { font-size: 24px; }
#prints { max-width: 1100px; margin: 0 auto; }
#prints h3 { font-size: 18px; margin: 14px 0 8px; border-bottom: 1.5px solid var(--ink); padding-bottom: 2px; }
#prints ol { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px 12px; }
#prints button { display: block; width: 100%; text-align: left; }
#prints .sheetlet { position: relative; display: block; aspect-ratio: 1 / 1.3; background: #d9d1ba; box-shadow: 0 0 0 1px rgba(16, 29, 56, .25); overflow: hidden; }
#prints img { width: 100%; height: 100%; object-fit: cover; display: block; }
#prints .num { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 40px; color: rgba(16, 29, 56, .24); }
#prints .next .sheetlet { box-shadow: 0 0 0 3px var(--red); }
#prints .name { display: block; margin-top: 6px; line-height: 1.25; font-size: 15.5px; font-weight: 700; }
#prints .got { color: var(--red); letter-spacing: .08em; font-size: 14px; display: block; min-height: 1.3em; }

#play { position: fixed; inset: 0; pointer-events: none; }
.topline { position: absolute; left: 0; right: 0; top: var(--top); display: flex; align-items: center; gap: 2px; padding: 3px 6px; color: #f7f0dc; pointer-events: auto; text-shadow: 0 1px 2px rgba(10, 20, 40, .55); }
.topline div { flex: 1; min-width: 0; }
.topline h2 { font-size: 18px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#vnum { font-size: 12.5px; line-height: 1.2; opacity: .9; }
#panel { position: absolute; left: 0; right: 0; bottom: 0; height: min(45dvh, 384px); padding: 8px 14px calc(var(--bottom) + 8px); background: var(--washi); pointer-events: auto; box-shadow: 0 -2px 0 var(--ink); display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
#panel > * { width: 100%; max-width: 640px; margin-left: auto; margin-right: auto; }
#say { flex: none; min-height: 2.7em; font-size: 15.5px; line-height: 1.32; font-weight: 700; }
#chart { flex: 1 1 60px; min-height: 0; display: block; }
#read { flex: none; min-height: 1.4em; font: 500 14px/1.35 'Zen Kaku Gothic New', system-ui, sans-serif; }
#read b { font-weight: 500; color: var(--red); }
.tg { font: 500 11px/1 'Zen Kaku Gothic New', system-ui, sans-serif; font-style: normal; padding: 1px 4px 2px; margin-right: 3px; color: #fbf3e0; background: var(--blue); vertical-align: 1px; white-space: nowrap; }
.tg.live { background: var(--red); }
.tg.stored { background: var(--blue); }
.tg.exact { background: #4e6b4a; }
.tg.toy { background: #9a7a33; }
.tg.lit { background: #4b3a6b; }
#ctrl { flex: none; display: flex; flex-direction: column; gap: 4px; }
#ctrl.grow { flex: 1 1 auto; }
#ctrl label { display: grid; grid-template-columns: minmax(3.6em, auto) 1fr minmax(3.4em, auto); gap: 8px; align-items: center; font-weight: 700; min-height: 42px; font-size: 15px; }
#ctrl output { text-align: right; font: 500 14.5px 'Zen Kaku Gothic New', system-ui, sans-serif; white-space: nowrap; }
#ctrl input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 42px; background: none; touch-action: none; }
#ctrl input[type=range]::-webkit-slider-runnable-track { height: 3px; background: var(--ink); }
#ctrl input[type=range]::-moz-range-track { height: 3px; background: var(--ink); }
#ctrl input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; margin-top: -14px; background: var(--red); border-radius: 0; box-shadow: 2px 2px 0 var(--ink); }
#ctrl input[type=range]::-moz-range-thumb { width: 28px; height: 28px; background: var(--red); border: 0; border-radius: 0; }
#ctrl .row { display: flex; gap: 8px; flex-wrap: wrap; }
#ctrl .row .stamp { flex: 1 1 0; min-width: 0; padding: 9px 8px; font-size: 15.5px; line-height: 1.2; min-height: 46px; }
#ctrl .stack { display: flex; flex-direction: column; gap: 6px; }
#ctrl .stack .stamp { width: 100%; padding: 8px 10px; font-size: 15px; line-height: 1.2; min-height: 44px; text-align: left; }
.hint { font-size: 14px; line-height: 1.3; }

#sunpad { position: fixed; touch-action: none; cursor: ew-resize; }
#sunlabel { position: absolute; top: 46px; transform: translate(-50%, 0); padding: 0 6px; background: rgba(16, 29, 56, .78); color: #f7f0dc; font: 500 13.5px 'Zen Kaku Gothic New', system-ui, sans-serif; white-space: nowrap; pointer-events: none; }

.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 92dvh; overflow-y: auto; background: var(--washi); padding: 18px 20px calc(var(--bottom) + 18px); box-shadow: 0 -3px 0 var(--ink); }
.sheet > * { max-width: 560px; margin-left: auto; margin-right: auto; }
.sheet h2 { font-size: 26px; line-height: 1.2; }
#bnum { font-size: 14.5px; }
#blede { margin-top: 8px; line-height: 1.6; }
#bgoal { margin-top: 10px; padding: 0; list-style: none; font-size: 15.5px; line-height: 1.4; }
#bgoal li { padding-left: 26px; position: relative; margin-top: 5px; }
#bgoal li::before { content: '力'; position: absolute; left: 0; top: 1px; width: 19px; height: 19px; background: var(--red); color: #fbf3e0; font-size: 12px; line-height: 19px; text-align: center; }
#bgo { display: block; margin-top: 14px; margin-left: 0; }
#seals { display: flex; gap: 6px; min-height: 44px; margin-bottom: 8px; }
#seals i { width: 40px; height: 40px; display: grid; place-items: center; font-style: normal; background: var(--red); color: #fbf3e0; font-size: 22px; font-weight: 700; box-shadow: 0 0 0 1.5px var(--washi), 0 0 0 2.5px var(--red); }
#seals i.off { background: none; color: rgba(16, 29, 56, .24); box-shadow: 0 0 0 1px rgba(16, 29, 56, .24); }
#seals i.land { animation: land .32s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes land { from { transform: scale(2.2) rotate(-8deg); opacity: 0; } }
#dscore { margin-top: 4px; }
#dformula { margin-top: 10px; padding: 8px 12px; background: rgba(16, 29, 56, .08); font: 500 16px/1.7 Georgia, 'Times New Roman', serif; overflow-x: auto; user-select: text; -webkit-user-select: text; }
#dtext { margin-top: 8px; line-height: 1.6; }
#dhonest { margin-top: 8px; font-size: 14px; line-height: 1.45; border-left: 3px solid var(--red); padding-left: 10px; }
#done .actions { margin-top: 12px; }

@media (min-width: 900px) and (min-aspect-ratio: 1/1) {
  #panel { left: auto; right: 22px; top: 76px; bottom: 22px; width: 420px; height: auto; box-shadow: 0 0 0 2px var(--ink); padding: 14px 18px; gap: 8px; }
  #say { font-size: 18px; min-height: 4.2em; }
  #read { font-size: 15.5px; }
  .topline h2 { font-size: 22px; }
  .sheet { left: auto; right: 22px; bottom: 22px; width: 460px; box-shadow: 0 0 0 2px var(--ink); }
  #title h1 { font-size: 66px; max-width: 10em; }
}
@media (max-height: 520px) {
  #panel { left: auto; top: 0; bottom: 0; height: auto; width: 52vw; right: env(safe-area-inset-right, 0); box-shadow: -2px 0 0 var(--ink); }
  #say { font-size: 14px; min-height: 2.6em; }
  .sheet { left: auto; width: 62vw; right: 0; max-height: 100dvh; }
  #title h1 { font-size: 28px; max-width: 14em; }
  #title .lede { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<canvas id="gl" aria-label="A woodblock print of molecules in water"></canvas>
<canvas id="ov" aria-hidden="true"></canvas>
<div id="sunpad" role="slider" tabindex="0" aria-label="Temperature" hidden><span id="sunlabel"></span></div>

<section id="title" class="page" hidden>
  <div class="cartouche" lang="ja" aria-hidden="true">分子間力十七景</div>
  <h1>Physical chemistry of biomolecules learner</h1>
  <div class="foot">
  <p class="lede">Seventeen bench experiments on the forces between molecules. The water is really simulated: every bond, every turn. You predict, you measure, and then the equation appears.</p>
  <div class="actions">
    <button id="begin" class="stamp"></button>
    <button id="to-album" class="plain">All seventeen prints</button>
  </div>
  </div>
</section>

<section id="album" class="page" hidden>
  <header class="bar"><button class="icon" data-home aria-label="Back to title">‹</button><h2>Seventeen prints</h2></header>
  <div id="prints"></div>
</section>

<section id="play" hidden>
  <header class="topline">
    <button class="icon" data-album aria-label="All prints">‹</button>
    <div><p id="vnum"></p><h2 id="vtitle"></h2></div>
    <button class="icon" id="sound" aria-label="Turn sound off"></button>
  </header>
  <div id="panel">
    <p id="say" aria-live="polite"></p>
    <canvas id="chart" hidden></canvas>
    <p id="read"></p>
    <div id="ctrl"></div>
  </div>
</section>

<section id="brief" class="sheet" hidden>
  <p id="bnum"></p>
  <h2 id="btitle"></h2>
  <p id="blede"></p>
  <ul id="bgoal"></ul>
  <button id="bgo" class="stamp">Begin</button>
</section>

<section id="done" class="sheet" hidden>
  <div id="seals"></div>
  <h2 id="dtitle"></h2>
  <p id="dscore"></p>
  <p id="dformula"></p>
  <p id="dtext"></p>
  <p id="dhonest"></p>
  <div class="actions">
    <button id="dnext" class="stamp"></button>
    <button id="dagain" class="plain">Print it again</button>
  </div>
</section>
