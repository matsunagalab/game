* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: #0d0c13; color: var(--vellum); overscroll-behavior: none; }
body { font: 400 18px/1.45 'IM Fell English', 'Iowan Old Style', Georgia, serif; user-select: none; -webkit-user-select: none; -webkit-text-size-adjust: 100%; }
#gl, #stage { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2 { font-weight: 400; }
[hidden] { display: none !important; }
.gilt { background: var(--gold); color: #1a1408; padding: 12px 26px; min-height: 50px; font-size: 20px; }
.gilt:active { background: #c9a24d; }
.plain { padding: 12px 6px; min-height: 48px; text-decoration: underline; text-underline-offset: 4px; }
.icon { width: 44px; height: 44px; font-size: 28px; line-height: 1; display: grid; place-items: center; flex: none; color: var(--gold); }
.icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }

#title { position: fixed; inset: 0; display: flex; flex-direction: column; padding: calc(var(--top) + 18px) 20px calc(var(--bottom) + 18px); pointer-events: none; background: linear-gradient(#0d0c13 12%, rgba(13, 12, 19, 0) 26%, rgba(13, 12, 19, 0) 66%, #0d0c13 80%); }
#title h1 { font-size: clamp(34px, 9.6vw, 60px); line-height: 1.04; color: var(--gold); text-align: center; max-width: 11em; margin: 0 auto; }
#title .foot { margin: auto auto 0; max-width: 28em; text-align: center; pointer-events: auto; }
#title p { line-height: 1.5; margin-bottom: 14px; }
#title button { pointer-events: auto; }

#chapters { position: fixed; inset: 0; pointer-events: none; }
.bar { display: flex; align-items: center; gap: 2px; padding: calc(var(--top) + 4px) 6px 0; pointer-events: auto; }
.bar h2 { font-size: 24px; color: var(--gold); }
#petals { list-style: none; padding: 0; margin: 0; position: absolute; left: 0; right: 0; bottom: 0; max-height: calc(100dvh - var(--top) - 60px); pointer-events: auto; background: linear-gradient(transparent, rgba(13, 12, 19, .92) 34px); overflow-y: auto; }
#petals { display: grid; grid-template-columns: 1fr; align-content: end; gap: 0; padding: 30px 14px calc(var(--bottom) + 8px); max-width: 620px; margin: 0 auto; }
#petals button { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 45px; text-align: left; border-bottom: 1px solid rgba(232, 195, 106, .3); padding: 3px 2px; }
#petals .n { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border: 1px solid var(--gold); color: var(--gold); border-radius: 50%; font-size: 18px; }
#petals .done .n { background: var(--gold); color: #1a1408; }
#petals .next .n { background: var(--ruby); color: #fff; border-color: var(--ruby); }
#petals .t { flex: 1; line-height: 1.15; }
#petals .t small { display: block; font-size: 14px; opacity: .78; }
#petals .r { color: var(--gold); letter-spacing: .08em; }

#hud { position: fixed; inset: 0; pointer-events: none; }
.topline { display: flex; align-items: center; gap: 2px; padding: calc(var(--top) + 4px) 6px 4px; pointer-events: auto; background: linear-gradient(#0d0c13 60%, transparent); }
.topline div { flex: 1; min-width: 0; }
.topline h2 { font-size: 20px; line-height: 1.15; color: var(--gold); }
#cnum { font-size: 15px; line-height: 1.2; }
#panel { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(var(--bottom) + 12px); background: var(--stone); border-top: 1px solid var(--gold); pointer-events: auto; }
#panel > * { max-width: 640px; margin-left: auto; margin-right: auto; }
#say { height: 2.64em; font-size: 16.5px; line-height: 1.32; overflow: hidden; }
#meters { display: flex; gap: 16px; margin-top: 6px; }
#meters > div { flex: 1; min-width: 0; }
#meters dt { font-size: 14px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#meters dd { margin: 0; font-size: 19px; line-height: 24px; min-height: 24px; white-space: nowrap; }
#meters i { display: block; height: 6px; background: rgba(232, 195, 106, .2); }
#meters i b { display: block; height: 100%; background: var(--gold); }

.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 86dvh; overflow-y: auto; background: var(--stone); border-top: 1px solid var(--gold); padding: 18px 20px calc(var(--bottom) + 20px); }
.sheet > * { max-width: 560px; margin-left: auto; margin-right: auto; }
.sheet h2 { font-size: 28px; line-height: 1.14; color: var(--gold); }
#bnum { font-size: 15.5px; }
#bmol { font-style: italic; color: var(--gold); margin-top: 2px; }
#blede { margin-top: 10px; line-height: 1.5; }
#bgoal { margin-top: 10px; line-height: 1.45; font-style: italic; color: var(--gold); }
#bgoals { margin-top: 8px; padding: 0 0 0 1.2em; font-size: 16px; line-height: 1.3; list-style: '❀ '; }
#bcarry { margin-top: 8px; font-size: 16px; line-height: 1.35; }
#bgo { display: inline-block; margin: 14px 12px 0 0; }
#bback { margin-top: 14px; }
#roses { display: flex; gap: 8px; margin-bottom: 8px; min-height: 40px; }
#roses i { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--gold); opacity: .3; }
#roses i.on { opacity: 1; background: radial-gradient(#fff3c4, var(--gold) 45%, #b4412f 46%, var(--ruby) 66%, var(--gold) 67%); animation: ring .4s cubic-bezier(.2, 1.5, .4, 1) both; }
@keyframes ring { from { transform: scale(.3); opacity: 0; } }
#deffect { margin-top: 8px; line-height: 1.4; }
#dterm { margin-top: 8px; font-style: italic; color: var(--gold); line-height: 1.4; }
#dmore { margin-top: 8px; }
#dmore summary { cursor: pointer; text-decoration: underline; text-underline-offset: 4px; line-height: 1.5; min-height: 32px; }
#dnote { margin-top: 6px; line-height: 1.45; font-size: 16.5px; }
#dsrc { margin-top: 6px; line-height: 1.35; font-size: 14.5px; opacity: .8; }
#done .actions { margin-top: 14px; }

#cellbar { position: fixed; top: calc(var(--top) + 6px); left: 8px; right: 8px; display: flex; gap: 10px; justify-content: center; padding: 4px 8px; background: rgba(13, 12, 19, .78); border-bottom: 1px solid rgba(232, 195, 106, .4); pointer-events: none; }
#cellbar.under { top: calc(var(--top) + 50px); }
#cellbar div { min-width: 0; flex: 0 1 25%; line-height: 1.1; }
#cellbar span { display: block; font-size: 13px; opacity: .8; white-space: nowrap; }
#cellbar strong { display: block; font-weight: 400; font-size: 16px; color: var(--gold); white-space: nowrap; }
#cellbar i { display: block; height: 4px; margin-top: 2px; background: rgba(232, 195, 106, .2); }
#cellbar i b { display: block; height: 100%; background: var(--gold); }
#dgnum { font-size: 15.5px; }
#dgwhat { margin-top: 6px; line-height: 1.4; }
#dgq { margin-top: 8px; font-style: italic; color: var(--gold); line-height: 1.35; }
#dgopts { display: grid; gap: 6px; margin-top: 8px; }
.dopt { min-height: 46px; padding: 6px 12px; text-align: left; line-height: 1.2; border: 1px solid rgba(232, 195, 106, .6); background: rgba(232, 195, 106, .08); }
.dopt.right { background: #1d6f45; border-color: #1d6f45; color: #fff; }
.dopt.wrong { background: #8d2233; border-color: #8d2233; color: #fff; }
.dopt:disabled { cursor: default; }
#dgwhy { margin-top: 8px; line-height: 1.4; }
#drug .actions { margin-top: 10px; }

@media (min-width: 900px) and (min-aspect-ratio: 1/1) {
  #panel, .sheet { left: auto; right: 22px; bottom: 22px; width: 400px; border: 1px solid var(--gold); }
  #cellbar { left: auto; right: 22px; width: 400px; }
  #title h1 { max-width: 16em; }
  #petals { max-width: 420px; margin: 0 22px 0 auto; }
}
@media (max-height: 480px) {
  #panel, .sheet { left: auto; right: 0; width: 48vw; max-height: 100dvh; }
  #title h1 { font-size: 26px; max-width: none; }
  #title p { display: none; }
  #say { font-size: 15px; min-height: 0; }
}
@media (max-width: 360px) { #say { font-size: 15px; } #meters dd { font-size: 17px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<canvas id="gl" aria-label="A stained glass rose window showing a living cell"></canvas>
<canvas id="stage" aria-label="The molecular stage"></canvas>

<div id="cellbar" hidden></div>

<section id="title" hidden>
  <h1>Molecular biology of the cell learner</h1>
  <div class="foot">
    <p>Every pane of this window is a machine one molecule wide. Go in, work as the molecule, and watch what you do light up the cell.</p>
    <button id="begin" class="gilt"></button>
  </div>
</section>

<section id="chapters" hidden>
  <header class="bar"><button class="icon" data-title aria-label="Back to title">‹</button><h2>One day in a cell</h2></header>
  <ol id="petals"></ol>
</section>

<section id="hud" hidden>
  <header class="topline">
    <button class="icon" data-chapters aria-label="All chapters">‹</button>
    <div><p id="cnum"></p><h2 id="ctitle"></h2></div>
    <button class="icon" id="sound" aria-label="Turn sound off"></button>
  </header>
  <div id="panel">
    <p id="say"></p>
    <dl id="meters"></dl>
  </div>
</section>

<section id="brief" class="sheet" hidden>
  <p id="bnum"></p>
  <h2 id="btitle"></h2>
  <p id="bmol"></p>
  <p id="blede"></p>
  <p id="bgoal"></p>
  <ol id="bgoals"></ol>
  <p id="bcarry"></p>
  <button id="bgo" class="gilt">Go in</button>
  <button id="bback" class="plain">All chapters</button>
</section>

<section id="drug" class="sheet" hidden>
  <p id="dgnum"></p>
  <h2 id="dgname"></h2>
  <p id="dgwhat"></p>
  <p id="dgq"></p>
  <div id="dgopts"></div>
  <p id="dgwhy" hidden></p>
  <div class="actions">
    <button id="dgnext" class="gilt" hidden>Go on</button>
    <button id="dgskip" class="plain">Skip</button>
  </div>
</section>

<section id="done" class="sheet" hidden>
  <div id="roses"></div>
  <h2 id="dtitle"></h2>
  <p id="dscore"></p>
  <p id="deffect"></p>
  <p id="dterm"></p>
  <details id="dmore"><summary>What the real molecule does, and what the game changes</summary>
    <p id="dnote"></p>
    <p id="dsrc"></p>
  </details>
  <div class="actions">
    <button id="dnext" class="gilt"></button>
    <button id="dagain" class="plain">Play it again</button>
    <button id="dback" class="plain">All chapters</button>
  </div>
</section>

"A cancer drug. It bonds to the cysteine of KRAS G12C and holds the protein in its GDP shape.",q:"This tumour cell carries G12C. What happens?",options:[{t:"ERK falls, and the cell stops growing",ok:!0,why:"Ras is held off, so RAF and ERK go quiet. It was approved in 2021 for some lung cancers."},{t:"Every Ras in the body shuts off",why:"Only G12C has that cysteine. Normal Ras and G12V are not hit this way."},{t:"ERK rises, with Ras stuck on GTP",why:"It holds the GDP form, so Ras is stuck off. ERK falls."}],fx:{stop:["signal"],dim:[1,3],rim:.7}}]},{id:"transcribe",title:"Reading the gene",molecule:"RNA polymerase II",icon:"pol2",iconColors:["#3163d8","#8446c4","#62b1ec","#f2cc6a","#e3a02f"],pane:{x:-.3,y:-.26,k:.1},zoom:[["A whole cell","20 \xB5m"],["The nucleus","5 \xB5m"],["One RNA polymerase","15 nm"]],lede:"ERK has reached the nucleus, and the gene for cyclin D1 opens. RNA polymerase II reads the template strand of DNA from its 3\u2032 end to its 5\u2032 end and builds RNA from 5\u2032 to 3\u2032.",goal:"You are the active site. Pick the RNA base that pairs with each template base. RNA uses U where DNA uses T.",roses:["Finish the transcript and splice it","No mistakes left in the RNA","No mistakes at all, and fast"],effect:"A finished messenger RNA for cyclin D1 leaves through a nuclear pore. How many copies depends on how much Fos survived.",term:"A gene is read one base at a time. U1 marks the splice site by pairing with it, and the rest of the spliceosome does the cutting.",note:"This is the real start of the coding part of human CCND1. Transcription begins 158 bases earlier, in a leader the ribosome does not translate. The real exon 1 ends GAG, and the intron, 1,519 bases long, begins GU and ends AG. U1 pairs better here than anywhere nearby, but stronger matches lie elsewhere in the gene, so U1 pairing alone does not choose the site. Other proteins help. Most human introns start GU and end AG. In cells Pol II runs at about 2,000 bases a minute (roughly 30 per second) and leaves about 1 error in 100,000 to 1,000,000. It can back up, and TFIIS helps it cut off the end, usually two bases. The game plays 36 bases and skips 162, and leaves out the 5\u2032 cap and the poly-A tail. Your transcript goes into the next chapter, mistakes included.",sources:"PDB 1I6H (yeast Pol II elongation complex). CCND1 from Ensembl ENST00000227507 and NM_053056.3. Jonkers 2014; Sydow 2009; Wang 2009; Gout 2017; Burset 2000; Bushnell 2002; Kaplan 2008; Letschert 2006.",drugs:[{name:"\u03B1-Amanitin",what:"The poison of the death cap mushroom. It sits by the bridge helix of Pol II, and the enzyme can hardly move on along the DNA.",q:"What does this cell lose first?",options:[{t:"New mRNA, and proteins fade after it",ok:!0,why:"The cell lives for hours on the mRNA it already has, and then its proteins run out. In people the liver suffers most, because liver cells take the toxin up."},{t:"Its DNA, because the gene is cut",why:"Amanitin cuts nothing. The gene is intact, but it cannot be read."},{t:"Its ATP, because mitochondria stop",why:"Mitochondria are not the target. They run on until their supply of new proteins fails."}],fx:{stop:["transcribe"],dim:[1,3]}}]},{id:"translate",title:"Two checks for every codon",molecule:"The ribosome",icon:"ribo",iconColors:["#e3a02f","#e8742a","#2fa8a0","#3163d8"],pane:{x:-.66,y:.42,k:.09},zoom:[["A whole cell","20 \xB5m"],["A patch of cytosol","200 nm"],["One ribosome","25 nm"]],lede:"Your mRNA has reached a ribosome. Each transfer RNA carries one amino acid and shows three bases, its anticodon. A wrong tRNA has to pass two checks, and GTP hydrolysis by EF-Tu lies between them.",goal:"The ribosome judges each tRNA by the shape of the helix. You set the pace: hold to hurry, and let go to give a wrong tRNA time to fall off.",roses:["Finish 14 amino acids","At most 1 wrong amino acid","No wrong amino acids, inside 45 seconds"],effect:"A chain of cyclin D1 folds in the cytosol. A wrong amino acid can make a protein misfold.",term:"Each check can be fooled. Two checks, with GTP spent between them, multiply.",note:"The ribosome did the checking, not you. A1493 feels the first pair, A1492 with G530 the second, and the third is checked less closely, which is why wobble exists. A correct helix sets off the GTPase of EF-Tu about 650 times faster than a wrong one in bacteria (Gromadski 2004). The gap here is far smaller, so that errors can be seen. This is usually pictured as the small subunit closing on a correct helix. But wrong pairs can slip into a right-looking shape and give the same closure in crystals (Demeshkina 2012), so how the signal is passed on is debated. Either way, no single look is perfect. One look can only be as good as the difference it senses. A second look after a step that cannot be undone multiplies the two (Hopfield 1974, Ninio 1975). Bacterial ribosomes add about 15 amino acids per second, ours about 5 or 6, and about 1 amino acid in 1,000 to 10,000 is wrong. That is per amino acid, while the tally you saw is per wrong tRNA in a game with far weaker checks. The code itself is enforced earlier: each aminoacyl-tRNA synthetase joins one amino acid to its own tRNA, and many destroy their own wrong products, so such mistakes are rarer than errors at the ribosome. The atoms and the ribosome drawn are bacterial, and your cells use eEF1A in place of EF-Tu.",sources:"PDB 4V51 (T. thermophilus 70S with tRNAs), 1J5E and 1IBM (T. thermophilus 30S, empty and with a codon\u2013anticodon helix), 1TTT (EF-Tu\xB7GDPNP\xB7tRNA), 1EHZ (yeast tRNA-Phe). Hopfield 1974; Ninio 1975; Gromadski 2004; Pape 1999; Ogle 2001, 2002; Demeshkina 2012; Rozov 2016; Kramer 2007; Ingolia 2011; Loftfield 1972; Prokhorova 2017 (G418 crystal: yeast 80S, PDB 5NDG); Bar-Nun 1983; Schneider-Poetsch 2010.",drugs:[{name:"G418",what:"An aminoglycoside antibiotic. It binds the decoding centre of ribosomes like ours as well as bacterial ones, and the ribosome misreads.",q:"What happens to the proteins this cell makes?",options:[{t:"Wrong amino acids, and misfolded protein",ok:!0,why:"The checks let wrong tRNAs through, so chains fill with errors and misfold. In bacteria paromomycin does this by holding A1492 and A1493 flipped out."},{t:"Translation stops dead",why:"That is closer to cycloheximide, which jams the ribosome at its E site. At lower doses G418 lets it run on, badly. High doses hold back elongation too."},{t:"Accuracy rises",why:"It is the other way round: a drug that holds the site in its accepting shape makes the check easier to pass."}],fx:{ruby:!0,stress:.22}}]},{id:"target",title:"Where does it go?",molecule:"SRP and Sec61",icon:"sec",iconColors:["#18a7a3","#e2589c"],pane:{x:-.62,y:-.1,k:.09},zoom:[["A whole cell","20 \xB5m"],["The rough ER","500 nm"],["One translocon","6 nm"]],lede:"A growing cell needs proteins everywhere. A protein bound for the ER starts with a signal peptide, a short greasy stretch. SRP catches it as it leaves the ribosome. Other chains stay in the cytosol, and Hsp70 guards their greasy patches.",goal:"Watch the real sequence come out. Gold residues are greasy. 8 gold of any 10 means SRP. Otherwise let it go to Hsp70.",roses:["Sort the chains and thread TGF-\u03B1","Every chain sorted right","All right, the signal cut exactly, the stop-transfer caught exactly"],effect:"The ER fills with new proteins. TGF-\u03B1 sits in the ER membrane, and will go on through the Golgi to the cell surface.",term:"The sequence is the address: signal peptide to enter, about 20 greasy residues to stop.",note:"All these are real human sequences. The 8-of-10 rule is ours, and real signals are judged more subtly; actin is a close call at 7. SRP54 holds the signal in a flexible methionine-rich groove and slows translation until SRP docks on its receptor in the ER membrane and hands the ribosome to Sec61. Signal peptidase cuts at a set site, usually with small residues at \u22123 and \u22121. The cut after residue 23 of TGF-\u03B1 is predicted, not measured. A stretch of about 20 greasy residues leaves Sec61 sideways through its lateral gate. TGF-\u03B1 is a growth factor, so the cell is making a signal like the one that started this day. Sec61 is drawn from the archaeal SecYE\u03B2, a close relative, and SRP and Hsp70 from E. coli. In Hsp70, ATP loosens the grip and ADP clamps.",sources:"PDB 1RH5 (M. jannaschii SecYE\u03B2), 2J28 (E. coli SRP on a ribosome), 2KHO (E. coli DnaK), 4V51. UniProt sequences. Bernstein 1989; Keenan 1998; Janda 2010; Akopian 2013; Hessa 2005, 2007; Kyte 1982; Mayer 2005; Baron 2016; McKenna 2016, 2017; G\xE9rard 2020; Itskanov 2023.",drugs:[{name:"Mycolactone",what:"The toxin of Mycobacterium ulcerans, which causes Buruli ulcer. It wedges into Sec61 and blocks the way into the ER.",q:"What becomes of proteins with a signal peptide?",options:[{t:"Many stay in the cytosol and are destroyed",ok:!0,why:"They cannot enter the ER, so the cytosol breaks them down. The surface slowly loses its proteins. How badly each is hit depends on its signal."},{t:"They enter the ER faster",why:"The way in is blocked. The toxin wedges the side gate ajar, but it sits where the signal must go."},{t:"Actin and other cytosolic proteins vanish",why:"Those never used Sec61, so they carry on."}],fx:{stop:["target"],dim:[2,4],ruby:!0}}]},{id:"energy",title:"The rotary engine",molecule:"ATP synthase",icon:"c8",iconColors:["#d0304a","#e3a02f"],pane:{x:.68,y:-.42,k:.08},zoom:[["A whole cell","20 \xB5m"],["A mitochondrion","1 \xB5m"],["One ATP synthase","20 nm"]],lede:"All of this building has a price, paid in ATP. In the inner membrane of a mitochondrion, respiration pumps protons out, and they flow back through ATP synthase, turning its ring. Yours has 8 c-subunits, the same as a cow.",goal:"Tap each NADH to pump protons. Spin the ring with your finger. A site must take a proton before it can pass into the oily membrane. What you make here pays for the rest of the day.",roses:["Make 30 ATP","Never let the gradient stall, and pick the right ring","Make them in 38 seconds, without slipping back"],effect:"The mitochondria glow, as bright as your stock of ATP. It will pay for the pump, the motor and the division.",term:"Three ATP per turn. The ring size sets how many protons each turn costs.",note:"A bare, charged glutamate cannot enter the lipid, so the ring can only turn when a proton has neutralised it, one site at a time. An arginine in subunit a stands between the two half-channels, beside that glutamate, so protons cannot run straight through. The structures place it there (Arg159 in cow). A stalk of OSCP, b, d and F6 holds the head still against the turning shaft; it is drawn as a line because it is not in the structure used. The bent \u03B3 shaft props one \u03B2 subunit open and keeps the three in different states, and most of its work goes into changing their shape so that tight ATP can let go. The labels Open, Loose and Tight follow Yang 2003, and Abrahams 1994 took the \u03B2DP site as the tight one. Three ATP per turn with 8 sites is about 2.7 protons per ATP in the simple model. Yeast and E. coli have 10, spinach chloroplasts 14. Measured ratios differ a little from c/3. A small ring gives more ATP per proton but needs a stronger gradient, about 200 mV in the mitochondrion. The stall voltages here use 50 kJ/mol for making ATP, a value that varies with cell conditions. A real one spins about 100 times per second, about 300 ATP per second, and we recycle roughly our body weight of ATP each day. Ten protons per NADH is a common estimate. Below stall a real enzyme can run backward, as here. The ATP stock in this game is a budget: real cells hold ATP nearly constant unless something is badly wrong.",sources:"PDB 2XND (bovine F1-c8), 2XOK (yeast c10), 2W5J (spinach c14). Abrahams 1994; Yang 2003; Martin 2014; Czub 2014; Watt 2010; Noji 1997; Stock 1999; Pogoryelov 2009; Hinkle 2005; Zhou 2015; Allegretti 2015; Symersky 2012; Brand 2011; Grundlingh 2011; Nicholls 2001.",drugs:[{name:"Oligomycin",what:"It sits on the c-ring and blocks the path for protons through ATP synthase.",q:"What does the proton gradient do?",options:[{t:"It stays high, and oxygen use falls",ok:!0,why:"Protons cannot get back, so the gradient stays high and the pumps have to push against it. ATP from the mitochondria stops."},{t:"It collapses",why:"That needs a hole in the membrane. Oligomycin blocks the main way back, and only a slow leak remains."},{t:"The ring spins faster",why:"The ring is jammed. No protons, no turning."}],fx:{stop:["energy"],dim:[5]}},{name:"DNP",what:"A small molecule that carries protons across the membrane, past the synthase.",q:"What happens now?",options:[{t:"The gradient collapses, oxygen use rises, and heat comes off",ok:!0,why:"With no back-pressure the chain runs flat out and the energy becomes heat. DNP was sold for slimming in the 1930s and dropped as dangerous, though it is still sold online and still kills. Brown fat does this safely with UCP1."},{t:"ATP synthesis speeds up",why:"The protons bypass the ring, so it cannot turn."},{t:"Respiration stops",why:"The reverse: with nothing to push against, respiration speeds up."}],fx:{stop:["energy"],dim:[5],stress:.5}}]},{id:"ions",title:"Salt in, salt out",molecule:"KcsA and the Na\u207A/K\u207A pump",icon:"nakE1",iconColors:["#e2589c","#8446c4"],pane:{x:-.2,y:.84,k:.09},zoom:[["A whole cell","20 \xB5m"],["The cell membrane","50 nm"],["One pump and one channel","10 nm"]],lede:"ATP pays first for the salt balance of the cell. Without it, ions leak until the voltage across the membrane fades and water swells the cell. A K\u207A channel lets potassium pass and refuses sodium, and the Na\u207A/K\u207A pump pushes both back uphill.",goal:"Try one K\u207A and one Na\u207A in the channel. Then run the pump: 3 Na\u207A, ATP, outer gate, 2 K\u207A, inner gate. Never open one gate while the other is open.",roses:["Finish, and see what the cell keeps","Reach \u221265 mV with at most 2 wrong ions","Reach \u221265 mV in 60 seconds, with no wrong ions and no collapse"],effect:"The whole membrane holds its voltage. Gradients now drive nutrient uptake and keep the cell from swelling.",term:"Three sodium out, two potassium in, one ATP: the pump that keeps up the gradients the voltage is built on.",note:"The voltage itself comes from K\u207A leaking out through channels. The pump keeps up the gradient that leak runs on. Only one side of the pump is open at a time, so ions can never flow straight through. Palytoxin breaks that rule, and the pump behaves like an open hole (Artigas 2003, in membrane patches). In the channel, K\u207A gives up its water to rings of carbonyl oxygens that stand in for it. Na\u207A is smaller and holds its water more tightly. K\u207A channels favour K\u207A about 1,000-fold over Na\u207A (over 150-fold measured for KcsA), near 100 million ions per second. How exact the fit must be is still argued over, and carbonyls are less rigid than drawn. KcsA is bacterial, and human channels share its filter. The pump phosphorylates an aspartate (Asp376 in human \u03B11) and swings between E1 and E2 about 200 times per second. Ions move by diffusion, not by being picked, and K\u207A is drawn much bigger than life. The voltage uses the Goldman equation at 37 \xB0C with sodium 4% as permeant, and concentrations change far faster here than in life. A resting cell spends about a fifth to a quarter of its ATP on this pump, a neuron about two-thirds.",sources:"PDB 1K4C (KcsA), 3WGU (pig pump, Na\u207A), 2ZXE (shark pump, K\u207A). Doyle 1998; Zhou 2001; LeMasurier 2001; Noskov 2004; K\xF6pfer 2014; Rolfe 1997; Artigas 2003; Tosteson 1960; Laursen 2013.",drugs:[{name:"Ouabain",what:"An arrow poison from African plants. It binds the pump from outside, and the pump stops. Digoxin from foxglove is its relative.",q:"What happens to this cell?",options:[{t:"Na\u207A builds up, the voltage fades, the cell swells",ok:!0,why:"The leaks run on with no pump to answer them, and water follows the salt, as red cells show. In the heart a little digoxin raises Ca\xB2\u207A by way of Na\u207A, and the beat grows stronger. It eases symptoms."},{t:"The voltage grows stronger",why:"The voltage rests on gradients the pump keeps up. With the pump stopped they run down."},{t:"K\u207A channels shut",why:"They stay open. That is why K\u207A keeps leaking away."}],fx:{stop:["ions"],swell:.13,rim:.55,stress:.14}}]},{id:"motors",title:"Eight nanometres at a time",molecule:"Kinesin",icon:"kin",iconColors:["#d0304a","#f2cc6a"],pane:{x:.1,y:.1,k:.08},zoom:[["A whole cell","20 \xB5m"],["One microtubule","200 nm"],["One kinesin","16 nm"]],lede:"Your TGF-\u03B1 has left the Golgi in a vesicle, and it must reach the cell surface. Kinesin carries it along a microtubule. The two heads walk hand over hand, and each ATP buys one step.",goal:"When ATP drifts past the empty head, tap that head's side of the screen. ATP on the empty head is split, its neck linker zips down, and the free rear head reaches the next site ahead.",roses:["Carry the vesicle as far as you can","Reach the surface, at most 6 misses","At most 2 misses, ahead of the shrinking track"],effect:"Vesicles run along the microtubules, and TGF-\u03B1 reaches the surface of the cell.",term:"Each head moves 16 nm, the cargo 8 nm, for one ATP.",note:"Which head is empty alternates, because each step swaps front and back. ATP binds the empty head and is hydrolysed, the neck linker docks, and the tethered head diffuses forward, lands and loses its ADP. The two heads are tied together by short linkers, and the pull between them keeps them from letting go at the same time. The front head waits, the rear head is helped off, or both: which gate dominates is still argued. So one head is almost always holding on, and kinesin stays on for about 100 steps. This waiting state with one head bound holds at low ATP. At high ATP two heads are bound for half the cycle or more; measurements differ. In cells kinesin walks about 800 nm per second and stalls near 6 pN. Without ATP the head stays stuck, a state called rigor. The microtubule loses its GTP cap and shrinks: that is dynamic instability. Dynein walks the other way, towards the minus end. Here one step takes about a second, not a hundredth of a second, the track is 13 protofilaments in life but one in the picture, and the two crystals shown both hold ADP, one with the linker undocked and one docked. In the second crystal a bound sulfate, not the nucleotide, holds the linker docked (Sindelar 2002). Docking on the microtubule depends on ATP and its hydrolysis (Milic 2014). Monastrol blocks a different motor, kinesin-5 (Eg5), which gives one-pole spindles.",sources:"PDB 1BG2 and 1MKJ (human kinesin motor, undocked and docked), 1JFF (tubulin). Schnitzer 1997; Hua 1997; Asbury 2003; Yildiz 2004, 2008; Rice 1999; Sindelar 2002; Milic 2014; Mickolajczyk 2015; Hancock 2016; Mori 2007; Alonso 2007; Rosenfeld 2003; Guydosh 2006; Andreasson 2015; Mitchison 1984; Zasadil 2014; Weaver 2014; LaPointe 2013; Mayer 1999.",drugs:[{name:"Taxol",what:"A cancer drug first found in yew bark. It binds \u03B2-tubulin and calms the growth and shrinkage of microtubules. The tubulin in this chapter was crystallised with it.",q:"What does this cell do?",options:[{t:"Kinesin still walks, but division goes wrong",ok:!0,why:"Tracks stay, so kinesin can still walk, though high doses slow transport in long nerve axons. A spindle needs microtubules that change: high doses hold cells at the checkpoint, and at tumour levels spindles grow extra poles."},{t:"Kinesin falls off at once",why:"Kinesin walks well on taxol microtubules. Most laboratory studies of it use them."},{t:"Microtubules fall apart",why:"It is the opposite: they are held still. Colchicine and vinblastine are the ones that take them apart."}],fx:{frozen:!0,stress:.1}}]},{id:"division",title:"The cut",molecule:"Aurora B, APC/C and separase",icon:"cdk",iconColors:["#3163d8","#e3a02f","#f2cc6a"],pane:{x:0,y:0,k:.34},zoom:[["A whole cell","20 \xB5m"],["The spindle","10 \xB5m"],["One kinetochore","100 nm"]],lede:"Cyclin D1 helped the cell past its restriction point, the DNA has been copied, and Cdk1 with cyclin B has driven the building of a spindle. Now each pair of sister chromatids must face both poles before a single molecule of cohesin is cut.",goal:"Tap any pair without tension. Aurora B sits between the sisters. With no pull to stretch them apart it reaches the kinetochore and phosphorylates it, and the grip loosens.",roses:["Divide the cell","No good attachment broken","Clean work, and all rings cut in a single stroke"],effect:"Two daughter cells, each with a full set of chromosomes. TGF-\u03B1, cut from the surface by ADAM17, lands on EGFR and starts the next day.",term:"The sisters part because one protease cuts one protein.",note:"On a leading model, tension pulls kinetochore targets away from Aurora B at the inner centromere (Liu 2009). How tension is sensed is still debated. A single unattached kinetochore is enough to hold anaphase back (Rieder 1995): it makes the complex of Mad2, BubR1, Bub3 and Cdc20 that blocks APC/C, a double negative. Switching the alarm off costs energy: TRIP13 with p31comet uses ATP to take that complex apart. Once it stops, APC/C with Cdc20 marks securin and cyclin B for the proteasome. In human cells the chains are mixed K11 and K48 links, and the rule of 4 ubiquitins is a simplification: amount and shape both count. Only the 20S core is drawn. The 19S cap that grips the chain is left out. Separase then cuts the Rad21 subunit of cohesin. Cdk1 also restrains separase in vertebrates, left out here. Separase is drawn from yeast, MCC from fission yeast, and APC/C, Aurora B and the proteasome from human structures. Cyclin B is drawn as its relative cyclin A, with Cdk2. Five pairs of sister chromatids stand for the 46 of a human cell, and each stage is shortened. Pro-TGF-\u03B1 reaches the surface as a membrane protein. ADAM17 cuts the soluble growth factor free, and it binds EGFR on the same cell or on its neighbours (work in mouse cells), so the product of the day can start the next.",sources:"PDB 4AF3 (human Aurora B\u2013INCENP), 4UI9 (human APC/C), 4AEZ (S. pombe MCC), 1UBQ (ubiquitin), 5LE5 (human 20S proteasome), 5U1T (yeast separase\u2013securin), 1FIN (Cdk2\u2013cyclin A). Tanaka 2002; Lampson 2004; Liu 2009; Rieder 1995; Sudakin 2001; De Antoni 2005; Eytan 2014; Ye 2015; Alfieri 2018; Uhlmann 1999, 2000; Meyer 2014; Yau 2017; Lu 2015; Thrower 2000; Sherwood 1993; Zur 2001; Takeda 2011; Zeng 2010; Groll 2006; Peschon 1998; Sahin 2004; Kirschner 1986.",drugs:[{name:"Bortezomib",what:"A myeloma drug that blocks a cutting site inside the proteasome. Go back an hour, with APC/C already at work.",q:"Securin carries its ubiquitin, but the proteasome cannot cut. What does the cell do?",options:[{t:"It stops, with its chromosomes lined up",ok:!0,why:"Securin and cyclin B survive, so separase stays held and cohesin stays whole. Bortezomib stops fission yeast at metaphase, and MG132 does the same in human cells."},{t:"The sisters part, only later",why:"Separase is free only when securin is destroyed. A mark alone is not enough."},{t:"The ubiquitin chain frees separase",why:"The chain is only a label. The proteasome does the destroying."}],fx:{arrest:!0,stress:.16}}]}];var Fu={egfr:{s:.431,g:[[511,3.6],[510,3.6],[47,3.8],[47,3.8]],d:"IB/dJxrbLxzfNxjdORPkQRDoQgruRw/zTw33Tgr/VggCVw8HXxMJYw0EaA/+aAv2cAvzdBPycBvzbxvqbBPpZxTwZBzsYxfkXhLoWRjsWBzkVxTgURLmTBrnTR3fRSDbQRziOiDlNxvsPRbxOQ/zPw35RRP9SRr6URr9VyD7Xh//ZyH9ZSb2bCv1bjT0bDXsZy7pYDDlWC3pUzLkTyriSyrpRjHnQSrkPybrNijuNSL0ORz5NRb9OxQDQRoGRx8DTx8GVSUFXCQJZSUIZCoBajD/ZTP4Yjv5Wjv2VDX2TTbvRzH0QjnyPDTvOy71Mi74MSj+NSICMBsENRgKMxAIOw4MQRISSRQTTBMbRBIdPhgdQh0XPh8PRCQNTCQQUioOWigSYisSYy8KajMLcjQIejMMejsLcjwPbT4IaDgDXzgCXEECVUH9Tjv+SD/5Qjn8PD/7NTr5NzT/LzUCLC0GMScKKiEMLx0SNh0WOyQaQSkWSSoZTzAXVzAcXzMaXjYSYz4SYUMLWUELVEgKTEsLSUIMSkQVQ0oTPUQQN0
